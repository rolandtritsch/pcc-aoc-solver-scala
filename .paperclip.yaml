schema: paperclip/v1
agents:
  cto:
    runtime:
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    adapter:
      type: opencode_local
      runner: legacy
      config:
        model: openrouter/deepseek/deepseek-v4-flash-0731
        command: /usr/local/bin/aoc-cto
        env:
          AOC_ROLE:
            type: plain
            value: cto
          AOC_WORKSPACE_ROOT:
            type: plain
            value: /workspaces/aoc
          JAVA_HOME:
            type: plain
            value: /opt/java
          OPENCODE_ALLOW_ALL_MODELS:
            type: plain
            value: 'true'
        timeoutSec: 1800
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
        AOC_PAPERCLIP_API_KEY:
          kind: secret
          requirement: optional
    permissions:
      canCreateAgents: false
    permissionGrants:
      - permissionKey: tasks:assign
        scope: null
  problem-gatherer:
    runtime:
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    adapter:
      type: opencode_local
      runner: legacy
      config:
        model: openrouter/deepseek/deepseek-v4-flash-0731
        command: /usr/local/bin/aoc-opencode
        env:
          AOC_ROLE:
            type: plain
            value: problem-gatherer
          AOC_WORKSPACE_ROOT:
            type: plain
            value: /workspaces/aoc
          JAVA_HOME:
            type: plain
            value: /opt/java
          OPENCODE_ALLOW_ALL_MODELS:
            type: plain
            value: 'true'
        timeoutSec: 1800
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
        AOC_PAPERCLIP_API_KEY:
          kind: secret
          requirement: optional
    permissions:
      canCreateAgents: false
  problem-solver:
    runtime:
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    adapter:
      type: opencode_local
      runner: legacy
      config:
        model: openrouter/baidu/ernie-5.5-flash-preview:free
        command: /usr/local/bin/aoc-opencode
        env:
          AOC_ROLE:
            type: plain
            value: problem-solver
          AOC_WORKSPACE_ROOT:
            type: plain
            value: /workspaces/aoc
          JAVA_HOME:
            type: plain
            value: /opt/java
          OPENCODE_ALLOW_ALL_MODELS:
            type: plain
            value: 'true'
        timeoutSec: 4200
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
        AOC_PAPERCLIP_API_KEY:
          kind: secret
          requirement: optional
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
    permissions:
      canCreateAgents: false
  problem-submitter:
    runtime:
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    adapter:
      type: opencode_local
      runner: legacy
      config:
        model: openrouter/deepseek/deepseek-v4-flash-0731
        command: /usr/local/bin/aoc-opencode
        env:
          AOC_ROLE:
            type: plain
            value: problem-submitter
          AOC_WORKSPACE_ROOT:
            type: plain
            value: /workspaces/aoc
          JAVA_HOME:
            type: plain
            value: /opt/java
          OPENCODE_ALLOW_ALL_MODELS:
            type: plain
            value: 'true'
        timeoutSec: 1800
    inputs:
      env:
        GH_TOKEN:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
        AOC_PAPERCLIP_API_KEY:
          kind: secret
          requirement: optional
    permissions:
      canCreateAgents: false
routines:
  daily-selection:
    status: paused
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        enabled: false
        cronExpression: 0 */2 * * *
        timezone: UTC
