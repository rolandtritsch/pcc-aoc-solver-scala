          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
          HOME:
            type: plain
            value: /paperclip
          PATH:
            type: plain
            value: /paperclip/.asdf/shims:/paperclip/.asdf/bin:/usr/local/bin:/usr/bin:/bin
          AOC_COMPANY_PACKAGE_DIR:
            type: plain
            value: /paperclip/company-packages/pcc-aoc-solver-scala
          AOC_REPO_DIR:
            type: plain
            value: /paperclip/workspaces/scala3-aoc
          AOC_CYCLE_STARTED_AT:
            type: plain
            value: SET_AT_DEPLOYMENT
        cwd: /paperclip/workspaces/scala3-aoc
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
        AOC_SESSION:
          kind: secret
          requirement: optional
        GH_TOKEN:
          kind: secret
          requirement: optional
    runtime:
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
