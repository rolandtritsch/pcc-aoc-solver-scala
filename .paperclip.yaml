schema: paperclip/v1
agents:
  cto:
    runtime:
      heartbeat:
        enabled: false
        maxConcurrentRuns: 1
    adapter:
      type: opencode_local
      runner: legacy
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: '{"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-flash-0731":{"id":"deepseek/deepseek-v4-flash-0731"}}}}'
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
          HOME:
            type: plain
            value: /home/paperclip
          PATH:
            type: plain
            value: /opt/java/bin:/opt/sbt/bin:/usr/local/bin:/usr/bin:/bin
          AOC_COMPANY_PACKAGE_DIR:
            type: plain
            value: /opt/aoc-company
          AOC_REPO_DIR:
            type: plain
            value: .
          AOC_CYCLE_STARTED_AT:
            type: plain
            value: SET_AT_DEPLOYMENT
        cwd: /paperclip/workspaces/scala3-aoc
        command: /usr/local/bin/aoc-cto
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: required
        GH_TOKEN:
          kind: secret
          requirement: required
  problem-gatherer:
    adapter:
      type: opencode_local
      runner: legacy
