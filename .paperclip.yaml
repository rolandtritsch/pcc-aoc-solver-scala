routines:
  daily-selection:
    status: active
    concurrencyPolicy: coalesce_if_active
    catchUpPolicy: skip_missed
    triggers:
      - kind: schedule
        enabled: true
        cronExpression: '0 6 * * *'
        timezone: UTC
