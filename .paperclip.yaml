        maxConcurrentRuns: 1
  watchdog:
    runtime:
      heartbeat:
        enabled: false
        intervalSec: 600
        maxConcurrentRuns: 1
        wakeOnDemand: false
        wakeOnAssignment: false
        wakeOnOnDemand: false
        wakeOnAutomation: false
    adapter:
      type: opencode_local
      runner: legacy
      config:
        model: deepseek/deepseek-v4-flash-0731
        command: /paperclip/company-packages/pcc-aoc-solver-scala/skills/aoc-watchdog/scripts/aoc_watchdog_runner.py
        env:
          PAPERCLIP_OPENCODE_PROVIDERS:
            type: plain
            value: '{"deepseek":{"npm":"@ai-sdk/openai-compatible","name":"OpenRouter DeepSeek","options":{"baseURL":"https://openrouter.ai/api/v1","apiKey":"{env:OPENROUTER_API_KEY}"},"models":{"deepseek-v4-flash-0731":{"id":"deepseek/deepseek-v4-flash-0731"}}}}'
          PAPERCLIP_OPENCODE_SMALL_MODEL:
            type: plain
            value: deepseek/deepseek-v4-flash-0731
          AOC_CYCLE_STARTED_AT:
            type: plain
            value: SET_AT_DEPLOYMENT
          HOME:
            type: plain
            value: /paperclip
          PATH:
            type: plain
            value: /paperclip/.asdf/shims:/paperclip/.asdf/bin:/usr/local/bin:/usr/bin:/bin
        timeoutSec: 120
    inputs:
      env:
        OPENROUTER_API_KEY:
          kind: secret
          requirement: optional
  model-tester:
    adapter:
      type: opencode_local
      runner: legacy
      config:
        model: deepseek/deepseek-v4-flash-0731
        env:
